name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Rust
        uses: dtolnay/rust-action@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Install cargo-apk
        run: cargo install cargo-apk

      - name: Build APK (Release)
        run: cargo apk build --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: doodle-cricket-apk
          path: target/android/release/apk/*.apk

      - name: Release APK to GitHub Releases
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: Doodle Cricket APK v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          files: target/android/release/apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
